# Docker Compose for local full-stack development.
# CUSTOMIZE: Update environment variables for production deployment.

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      PORTFOLIO_CORS_ORIGIN: "http://localhost:5173"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    depends_on:
      - api
