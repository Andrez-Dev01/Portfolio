<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Dashboard mockup -->
  <rect x="40" y="40" width="720" height="420" rx="8" fill="#0f0f1a" stroke="#2a2a4a" stroke-width="1"/>
  <rect x="60" y="60" width="200" height="12" rx="2" fill="#3a3a5a"/>
  <rect x="60" y="90" width="680" height="1" fill="#2a2a4a"/>
  <!-- Chart area -->
  <rect x="60" y="110" width="420" height="200" rx="4" fill="#12121f"/>
  <polyline points="80,280 140,220 200,240 260,160 320,180 380,120 440,140" fill="none" stroke="#6366f1" stroke-width="2"/>
  <polyline points="80,280 140,250 200,230 260,200 320,210 380,170 440,190" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.7"/>
  <!-- Stats cards -->
  <rect x="500" y="110" width="120" height="80" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <rect x="640" y="110" width="100" height="80" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <rect x="500" y="210" width="120" height="80" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <rect x="640" y="210" width="100" height="80" rx="4" fill="#1a1a2e" stroke="#2a2a4a"/>
  <!-- Bottom bars -->
  <rect x="60" y="330" width="680" height="110" rx="4" fill="#12121f"/>
  <rect x="80" y="360" width="40" height="60" rx="2" fill="#6366f1" opacity="0.8"/>
  <rect x="140" y="380" width="40" height="40" rx="2" fill="#6366f1" opacity="0.6"/>
  <rect x="200" y="350" width="40" height="70" rx="2" fill="#6366f1" opacity="0.9"/>
  <rect x="260" y="370" width="40" height="50" rx="2" fill="#6366f1" opacity="0.5"/>
  <rect x="320" y="340" width="40" height="80" rx="2" fill="#6366f1" opacity="0.7"/>
</svg>
